name: Send to TikTok inbox
# Five times a day, the oldest folder in outbox/ (a .mp4 video, or .jpg photos + caption.txt)
# is sent to the TikTok inbox as a draft. Run it by hand from the Actions tab to send more now.
on:
  schedule:
    - cron: "7 8 * * *"    # ~09:07 Paris (winter time) / 10:07 (summer)
    - cron: "7 11 * * *"   # ~12:07 / 13:07
    - cron: "7 14 * * *"   # ~15:07 / 16:07
    - cron: "7 17 * * *"   # ~18:07 / 19:07
    - cron: "7 19 * * *"   # ~20:07 / 21:07
  workflow_dispatch:
    inputs:
      count:
        description: "How many posts to send now"
        default: "1"
permissions:
  contents: write
concurrency: tiktok
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send drafts
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
          SEND_LIMIT: ${{ github.event.inputs.count || '1' }}
        run: python3 tools/tiktok.py send
      - name: Clear sent items and save the token
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          git add -A outbox 2>/dev/null || true
          git commit -qm "Sent to TikTok inbox [skip ci]" || exit 0
          git pull -q --rebase && git push -q
