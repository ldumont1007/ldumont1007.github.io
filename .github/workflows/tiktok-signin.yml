name: TikTok sign-in
# One-time: turns the code shown on https://ldumont1007.github.io/callback/ into a stored (encrypted) token.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code shown on the TikTok sign-in page"
        required: true
  push:
    paths: ["auth/code.txt"]
permissions:
  contents: write
concurrency: tiktok
jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exchange the code for a token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
          INPUT_CODE: ${{ github.event.inputs.code }}
        run: |
          CODE="${INPUT_CODE:-$(cat auth/code.txt 2>/dev/null)}"
          echo "::add-mask::$CODE"
          TIKTOK_CODE="$CODE" python3 tools/tiktok.py exchange
          git rm -q --ignore-unmatch auth/code.txt
      - name: Save the encrypted token
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          git add -A auth 2>/dev/null || true
          git status --short
          git commit -qm "Store TikTok sign-in [skip ci]" || { echo "::error::Nothing to save: the token was not stored"; exit 1; }
          git pull -q --rebase && git push -q
